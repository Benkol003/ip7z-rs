[package]
name = "ip7z-sys"
version = "0.1.0"
edition = "2024"
license = "MIT"
links = "7z"

[features]
dynamic = ["dep:libloading", "dep:winreg"]
static = ["dep:uasm", "dep:cc", "dep:git2", "dep:mail-parser", "dep:path-slash"]

[build-dependencies]
#only optional crates as not needed for dynamic linking 
git2 = { version = "0.20.4", optional = true, default-features = false }
mail-parser = { version = "0.11.3", optional = true }
cc = { version = "1.2.57", optional = true }
uasm = { version = "1.0.8", optional = true }
path-slash = { version = "0.2.1", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", optional = true }

[dependencies]
libloading = { version = "0.9.0", optional = true }
